<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="public/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="public/css/menu.css">
    <title>login de usuario</title>
</head>

<body>

<div class="wrapper fadeInDown">
  <div id="formContent">

    <!-- LOGO -->
    <div class="fadeIn first">
      <img src="public/img/hdlogo.png" id="icon" alt="User Icon" />
      <h1>Help-Desk</h1>
    </div>

    <!-- FORM -->
    <form id="frmLogin" method="POST" onsubmit="return loginUsuario()">
      
      <input type="text" id="login" class="fadeIn second form-control mb-2" name="login" placeholder="username" required>
      
      <input type="password" id="password" class="fadeIn third form-control" name="password" placeholder="password" required>

      <!-- 👁️ BOTÓN VER PASSWORD -->
      <div class="mt-2">
        <button type="button" class="btn btn-info btn-sm" onclick="verPassword()">
          👁️ Ver contraseña
        </button>
      </div>

      <br>

      <input type="submit" class="fadeIn fourth btn btn-primary" value="Entrar">
    </form>

    <!-- CONTACTO -->
    <div id="formFooter">
      <a class="underlineHover" href="#" data-toggle="modal" data-target="#modalContacto">
        Contactar con el administrador
      </a>
    </div>

  </div>
</div>

<!-- MODAL (Bootstrap 4) -->
<div class="modal fade" id="modalContacto" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Contacto</h5>
        <button type="button" class="close" data-dismiss="modal">
          <span>&times;</span>
        </button>
      </div>

      <div class="modal-body">
        Si no tienes una credencial llama al :5556273283
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">
          Cerrar
        </button>
      </div>

    </div>
  </div>
</div>

<!-- JS -->
<script src="public/jquery/jquery-3.6.0.min.js"></script>
<script src="public/bootstrap/popper.min.js"></script>
<script src="public/bootstrap/bootstrap.min.js"></script>

<!-- SweetAlert -->
<script src="public/sweetalert2/sweetalert2@11.js"></script>

<!-- LOGIN -->
<script src="public/js/usuarios/login.js"></script>

<!-- 👁️ SCRIPT VER PASSWORD -->
<script>
function verPassword() {
    let input = document.getElementById("password");

    if (input.type === "password") {
        input.type = "text";
    } else {
        input.type = "password";
    }
}
</script>

</body>
</html>
